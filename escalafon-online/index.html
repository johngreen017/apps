<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174b35">
  <title>Escalafón Online</title>
  <meta name="description" content="Acceso oficial a Escalafón Online">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eaf0ec}
    .app-shell{position:fixed;inset:0;overflow:hidden;background:#eaf0ec}
    iframe{position:absolute;inset:0;width:100%;height:calc(100% + 52px);border:0;background:#eaf0ec}
    .loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:#174b35;
      font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eaf0ec;z-index:2}
    .ready .loading{display:none}
    noscript{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#fff;
      font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  </style>
</head>
<body>
  <main class="app-shell" id="shell">
    <div class="loading">Abriendo Escalafón Online…</div>
    <iframe
      title="Escalafón Online"
      src="https://script.google.com/macros/s/AKfycbw1JKkWVX7qFp0_HkzuiUa508NpguohvRTwUYnuVl0iMMKzt1u4bHl0CtxDZmq3G4g/exec"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      onload="document.getElementById('shell').classList.add('ready')">
    </iframe>
  </main>
  <noscript>Activa JavaScript para abrir Escalafón Online.</noscript>
</body>
</html>
