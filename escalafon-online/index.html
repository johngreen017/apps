<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Escalafón">
  <link rel="icon" type="image/png" sizes="64x64" href="icons-v3/icon-64.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="icons-v3/icon-180.png?v=3">
  <link rel="apple-touch-icon" sizes="167x167" href="icons-v3/icon-167.png?v=3">
  <link rel="apple-touch-icon" sizes="152x152" href="icons-v3/icon-152.png?v=3">
  <link rel="apple-touch-icon" sizes="120x120" href="icons-v3/icon-120.png?v=3">
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <title>Escalafón Online</title>
  <meta name="description" content="Acceso oficial a Escalafón Online">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eaf0ec}
    .app-shell{position:fixed;inset:0;overflow:hidden;background:#eaf0ec}
    iframe{position:absolute;inset:0;width:100%;height:calc(100% + 52px);border:0;background:#eaf0ec}
    .loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:#174b35;
      font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eaf0ec;z-index:2}
    .ready .loading{display:none}
    noscript{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#fff;
      font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .push-button{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;border:1px solid #d7e7de;border-radius:999px;background:#174b35;color:#fff;padding:11px 16px;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 5px 18px #0e302380;cursor:pointer}
    .push-button[hidden]{display:none}
  </style>
</head>
<body>
  <main class="app-shell" id="shell">
    <div class="loading">Abriendo Escalafón Online…</div>
    <iframe id="appFrame"
      title="Escalafón Online"
      src="https://script.google.com/macros/s/AKfycbw1JKkWVX7qFp0_HkzuiUa508NpguohvRTwUYnuVl0iMMKzt1u4bHl0CtxDZmq3G4g/exec"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      onload="document.getElementById('shell').classList.add('ready')">
    </iframe>
  </main>
  <button id="pushButton" class="push-button" type="button" hidden>Activar notificaciones</button>
  <noscript>Activa JavaScript para abrir Escalafón Online.</noscript>
  <script>
    const appFrame = document.getElementById('appFrame');
    const pushButton = document.getElementById('pushButton');
    let ownerSession = false;
    let oneSignalReady = false;
    let oneSignalSdk = null;
    let appMessageSource = null;
    const ADMIN_DEVICE_STORAGE = 'apps.admin.device.v1';

    function stableAdminDeviceKey() {
      try {
        let key = localStorage.getItem(ADMIN_DEVICE_STORAGE);
        if (!key) {
          const bytes = crypto.getRandomValues(new Uint8Array(32));
          key = Array.from(bytes, b => b.toString(16).padStart(2,'0')).join('');
          localStorage.setItem(ADMIN_DEVICE_STORAGE,key);
        }
        if (!/^[a-f0-9]{64}$/.test(key)) throw new Error('invalid');
        const ua=navigator.userAgent||'';
        const ipad=/iPad/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
        const mobile=ipad||/Mobi|Android|iPhone|iPod/i.test(ua);
        return (mobile?'mobile':'desktop')+':'+key;
      } catch (error) {
        return '';
      }
    }

    function shareStableDevice() {
      const device=stableAdminDeviceKey();
      if (device && appFrame.contentWindow) {
        appFrame.contentWindow.postMessage({type:'escalafon-device-key',device},'*');
      }
    }

    appFrame.addEventListener('load', function() {
      [0,80,250,700].forEach(delay=>setTimeout(shareStableDevice,delay));
    });

    let oneSignalLoading = false;
    function ensureOneSignal() {
      if (oneSignalReady || oneSignalLoading || !ownerSession) return;
      oneSignalLoading = true;
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        oneSignalSdk = OneSignal;
        await OneSignal.init({
          appId: '0956c8db-37fb-4a11-98bd-397d121ae8fa',
          serviceWorkerParam: { scope: '/apps/escalafon-online/' },
          serviceWorkerPath: '/apps/escalafon-online/OneSignalSDKWorker.js'
        });
        oneSignalReady = true;
        oneSignalLoading = false;
        await updatePushButton();
        await shareSubscription();
      });
      const script = document.createElement('script');
      script.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
      script.defer = true;
      script.onerror = function() { oneSignalLoading = false; };
      document.head.appendChild(script);
    }

    window.addEventListener('message', async function(event) {
      let trustedGoogleOrigin = false;
      try {
        const hostname = new URL(event.origin).hostname;
        trustedGoogleOrigin = event.origin === 'https://script.google.com' || hostname === 'googleusercontent.com' || hostname.endsWith('.googleusercontent.com');
      } catch (error) {}
      if (!trustedGoogleOrigin || event.source!==appFrame.contentWindow || !event.data) return;
      if (event.data.type === 'escalafon-request-device-key') {
        appMessageSource = event.source;
        shareStableDevice();
      }
      if (event.data.type === 'escalafon-owner-session') {
        appMessageSource = event.source;
        ownerSession = event.data.owner === true;
        if (ownerSession) ensureOneSignal();
        await updatePushButton();
        if (ownerSession) await shareSubscription();
      }
      if (event.data.type === 'escalafon-enable-push') {
        appMessageSource = event.source;
        ownerSession = true;
        ensureOneSignal();
        await activatePush();
      }
    });

    function sendToApp(payload) {
      if (appMessageSource) appMessageSource.postMessage(payload, '*');
    }

    async function updatePushButton() {
      if (!ownerSession || !oneSignalReady) {
        pushButton.hidden = true;
        return;
      }
      pushButton.hidden = false;
      if (!oneSignalSdk.Notifications.isPushSupported()) {
        pushButton.textContent = 'Notificaciones no disponibles';
        pushButton.disabled = true;
        return;
      }
      const enabled = oneSignalSdk.User.PushSubscription.optedIn;
      pushButton.textContent = enabled ? 'Notificaciones activadas' : 'Activar notificaciones';
      pushButton.disabled = enabled;
    }

    async function shareSubscription() {
      if (!ownerSession || !oneSignalReady || !oneSignalSdk.User.PushSubscription.optedIn) return;
      const subscriptionId = oneSignalSdk.User.PushSubscription.id;
      if (subscriptionId) {
        sendToApp({type:'escalafon-push-subscription', subscriptionId});
        sendToApp({type:'escalafon-push-status', enabled:true});
      }
    }

    async function activatePush() {
      if (!ownerSession) return;
      if (!oneSignalReady) {
        sendToApp({type:'escalafon-push-status', enabled:false, error:'Las notificaciones todavía se están preparando. Inténtalo nuevamente en unos segundos.'});
        return;
      }
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.navigator.standalone) {
        sendToApp({type:'escalafon-push-status', enabled:false, error:'Abre Escalafón Online desde su icono en la pantalla de inicio para activar notificaciones.'});
        return;
      }
      try {
        await oneSignalSdk.Notifications.requestPermission();
        await oneSignalSdk.User.PushSubscription.optIn();
        await shareSubscription();
        if (!oneSignalSdk.User.PushSubscription.optedIn) {
          sendToApp({type:'escalafon-push-status', enabled:false, error:'El permiso de notificaciones no fue concedido.'});
        }
      } catch (error) {
        sendToApp({type:'escalafon-push-status', enabled:false, error:'No fue posible activar las notificaciones. Revisa el permiso de notificaciones del iPhone.'});
      }
      await updatePushButton();
    }

    pushButton.addEventListener('click', activatePush);
  </script>
</body>
</html>
