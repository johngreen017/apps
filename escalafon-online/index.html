<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174b35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Escalafón">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Escalafón Online</title>
  <meta name="description" content="Acceso oficial a Escalafón Online">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eaf0ec}
    .app-shell{position:fixed;inset:0;overflow:hidden;background:#eaf0ec}
    iframe{position:absolute;inset:0;width:100%;height:calc(100% + 52px);border:0;background:#eaf0ec}
    .loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;color:#174b35;
      font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eaf0ec;z-index:2}
    .ready .loading{display:none}
    noscript{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#fff;
      font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .push-button{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:5;border:1px solid #d7e7de;border-radius:999px;background:#174b35;color:#fff;padding:11px 16px;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 5px 18px #0e302380;cursor:pointer}
    .push-button[hidden]{display:none}
  </style>
</head>
<body>
  <main class="app-shell" id="shell">
    <div class="loading">Abriendo Escalafón Online…</div>
    <iframe id="appFrame"
      title="Escalafón Online"
      src="https://script.google.com/macros/s/AKfycbw1JKkWVX7qFp0_HkzuiUa508NpguohvRTwUYnuVl0iMMKzt1u4bHl0CtxDZmq3G4g/exec"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      onload="document.getElementById('shell').classList.add('ready')">
    </iframe>
  </main>
  <button id="pushButton" class="push-button" type="button" hidden>Activar notificaciones</button>
  <noscript>Activa JavaScript para abrir Escalafón Online.</noscript>
  <script>
    const appFrame = document.getElementById('appFrame');
    const pushButton = document.getElementById('pushButton');
    let ownerSession = false;
    let oneSignalReady = false;
    let oneSignalSdk = null;

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      oneSignalSdk = OneSignal;
      await OneSignal.init({appId: '0956c8db-37fb-4a11-98bd-397d121ae8fa'});
      oneSignalReady = true;
      await updatePushButton();
      await shareSubscription();
    });

    window.addEventListener('message', async function(event) {
      if (event.source !== appFrame.contentWindow || !event.data) return;
      if (event.data.type === 'escalafon-owner-session') {
        ownerSession = event.data.owner === true;
        await updatePushButton();
        if (ownerSession) await shareSubscription();
      }
      if (event.data.type === 'escalafon-enable-push') {
        ownerSession = true;
        await activatePush();
      }
    });

    async function updatePushButton() {
      if (!ownerSession || !oneSignalReady) {
        pushButton.hidden = true;
        return;
      }
      pushButton.hidden = false;
      if (!oneSignalSdk.Notifications.isPushSupported()) {
        pushButton.textContent = 'Notificaciones no disponibles';
        pushButton.disabled = true;
        return;
      }
      const enabled = oneSignalSdk.User.PushSubscription.optedIn;
      pushButton.textContent = enabled ? 'Notificaciones activadas' : 'Activar notificaciones';
      pushButton.disabled = enabled;
    }

    async function shareSubscription() {
      if (!ownerSession || !oneSignalReady || !oneSignalSdk.User.PushSubscription.optedIn) return;
      const subscriptionId = oneSignalSdk.User.PushSubscription.id;
      if (subscriptionId) {
        appFrame.contentWindow.postMessage({type:'escalafon-push-subscription', subscriptionId}, '*');
        appFrame.contentWindow.postMessage({type:'escalafon-push-status', enabled:true}, '*');
      }
    }

    async function activatePush() {
      if (!ownerSession) return;
      if (!oneSignalReady) {
        appFrame.contentWindow.postMessage({type:'escalafon-push-status', enabled:false, error:'Las notificaciones todavía se están preparando. Inténtalo nuevamente en unos segundos.'}, '*');
        return;
      }
      if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !window.navigator.standalone) {
        appFrame.contentWindow.postMessage({type:'escalafon-push-status', enabled:false, error:'Abre Escalafón Online desde su icono en la pantalla de inicio para activar notificaciones.'}, '*');
        return;
      }
      try {
        await oneSignalSdk.Notifications.requestPermission();
        await oneSignalSdk.User.PushSubscription.optIn();
        await shareSubscription();
        if (!oneSignalSdk.User.PushSubscription.optedIn) {
          appFrame.contentWindow.postMessage({type:'escalafon-push-status', enabled:false, error:'El permiso de notificaciones no fue concedido.'}, '*');
        }
      } catch (error) {
        appFrame.contentWindow.postMessage({type:'escalafon-push-status', enabled:false, error:'No fue posible activar las notificaciones. Revisa el permiso de notificaciones del iPhone.'}, '*');
      }
      await updatePushButton();
    }

    pushButton.addEventListener('click', activatePush);
  </script>
</body>
</html>
