<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#184e38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Revisor Cargo">
  <link rel="icon" type="image/png" sizes="64x64" href="icons-v6/favicon-64.png?v=6">
  <link rel="apple-touch-icon" sizes="180x180" href="icons-v6/apple-touch-icon-180.png?v=6">
  <link rel="apple-touch-icon" sizes="167x167" href="icons-v6/apple-touch-icon-167.png?v=6">
  <link rel="apple-touch-icon" sizes="152x152" href="icons-v6/apple-touch-icon-152.png?v=6">
  <link rel="manifest" href="manifest.webmanifest?v=6">
  <title>Revisor de Cargo Fiscal</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#eaf0ec}
    #shell{position:fixed;inset:0;background:#eaf0ec}iframe{position:absolute;inset:0;width:100%;height:calc(100% + 52px);border:0;background:#eaf0ec}
    #loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;z-index:2;color:#184e38;font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eaf0ec}
    .ready #loading{display:none}
    #googleLayer{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;width:min(92vw,360px);padding:12px;background:#fffffff2;border:1px solid #d5e4dc;border-radius:15px;box-shadow:0 10px 30px #0d30242e;text-align:center}
    #googleLayer[hidden]{display:none}#googleButton{min-height:44px;display:flex;justify-content:center}
    #googleStatus{margin:7px 0 0;color:#51675f;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main id="shell">
    <div id="loading">Abriendo Revisor de Cargo Fiscal…</div>
    <iframe id="app" title="Revisor de Cargo Fiscal"
      src="https://script.google.com/macros/s/AKfycbzZDRqPGO5638ZfEfuZVSOjfohLeyTlbpd9eE6CkqJppjp8T2-Nrp2Xilf-5LfRu0iR/exec"
      sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-downloads"
      allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <section id="googleLayer" hidden>
    <div id="googleButton"></div>
    <p id="googleStatus">Acceso seguro con Google.</p>
  </section>
  <noscript>Activa JavaScript para abrir el Revisor de Cargo Fiscal.</noscript>
<script>
const app=document.getElementById('app');
const shell=document.getElementById('shell');
const googleLayer=document.getElementById('googleLayer');
const googleStatus=document.getElementById('googleStatus');
let appSource=null,appOrigin='',googleClientId='892491045559-mt2b7iabv71djbu6icf6rpl2a2fa90e8.apps.googleusercontent.com',googleReady=false;

function trustedAppMessage(event){
  if(event.source!==app.contentWindow)return false;
  if(event.origin==='null'||event.origin==="null")return true;
  try{
    const url=new URL(event.origin),host=url.hostname;
    return url.protocol==='https:'&&(host==='script.google.com'||host==='googleusercontent.com'||host.endsWith('.googleusercontent.com'));
  }catch(_){return false;}
}
function bindAppMessage(event){
  if(!trustedAppMessage(event))return false;
  appSource=event.source;
  appOrigin=event.origin;
  return true;
}
function send(payload,bootstrap=false){
  const target=appSource||app.contentWindow;
  if(!target)return;
  if(appOrigin&&appOrigin!=='null')target.postMessage(payload,appOrigin);
  else if(appSource||bootstrap)target.postMessage(payload,'*');
}
function ensureStableDevice_(){
  try{
    const storage='apps.admin.device.v1';
    let key=localStorage.getItem(storage);
    if(!/^[a-f0-9]{64}$/.test(String(key||''))){
      const bytes=crypto.getRandomValues(new Uint8Array(32));
      key=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');
      localStorage.setItem(storage,key);
    }
  }catch(_){}
}
function collectMigrationStorage(){
  const values={};
  try{
    ensureStableDevice_();
    const allowed=['apps.admin.device.v1','revisorCargoFiscal.admin.device.v1','revisorCargoFiscal.admin.recordado.v1'];
    allowed.forEach(key=>{
      const value=localStorage.getItem(key);
      if(typeof value==='string')values[key]=value;
    });
  }catch(_){}
  return values;
}
function clearMigratedSensitiveStorage(){
  try{
    const remove=[];
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(!key)continue;
      if(key==='revisorCargoFiscal.acceso.v1'||key==='revisorCargoFiscal.usuario'||/^revisorCargoFiscal\.v\d+$/.test(key))remove.push(key);
    }
    remove.forEach(key=>localStorage.removeItem(key));
  }catch(_){}
}
function initGoogle(){
  if(googleReady||!googleClientId||!window.google?.accounts?.id)return;
  google.accounts.id.initialize({
    client_id:googleClientId,
    callback:r=>{
      const credential=r&&r.credential;
      if(!credential){googleStatus.textContent='Google no entregó una credencial válida.';return;}
      googleStatus.textContent='Validando la cuenta…';
      send({type:'apps-admin-google-credential',app:'revisor',credential});
    },
    auto_select:false,cancel_on_tap_outside:false
  });
  google.accounts.id.renderButton(document.getElementById('googleButton'),{type:'standard',theme:'outline',size:'large',text:'signin_with',shape:'rectangular',width:320,locale:'es'});
  googleReady=true;
}
window.addEventListener('message',event=>{
  if(!event.data||!bindAppMessage(event))return;
  const d=event.data;
  if(d.type==='apps-revisor-bridge-ready'&&d.app==='revisor'){
    if(typeof d.googleClientId==='string'&&/\.apps\.googleusercontent\.com$/.test(d.googleClientId))googleClientId=d.googleClientId;
    send({type:'apps-revisor-storage-sync',app:'revisor',values:collectMigrationStorage()});
    initGoogle();
  }else if(d.type==='apps-admin-google-required'&&d.app==='revisor'){
    googleLayer.hidden=false; shell.classList.add('ready'); initGoogle();
  }else if(d.type==='apps-admin-google-result'&&d.app==='revisor'){
    if(d.ok===true){googleLayer.hidden=true;googleStatus.textContent='Acceso seguro con Google.';}
    else{googleLayer.hidden=false;googleStatus.textContent='No se pudo ingresar con Google.';}
  }else if(d.type==='apps-revisor-storage-synced'&&d.app==='revisor'){
    if(d.ok===true)clearMigratedSensitiveStorage();
  }
});
app.addEventListener('load',()=>{shell.classList.add('ready');send({type:'apps-revisor-bridge-request',app:'revisor'},true);});
window.addEventListener('load',initGoogle,{once:true});
</script>
</body>
</html>
