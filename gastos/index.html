<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mis Gastos">
  <meta name="application-name" content="Mis Gastos">
  <link rel="icon" type="image/png" href="apple-touch-icon.png?v=20261017">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=20261017">
  <link rel="manifest" href="site.webmanifest?v=20261017">
  <title>Mis Gastos</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    #shell{position:fixed;inset:0;background:#000}
    iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
    #loading{position:absolute;inset:0;display:grid;place-items:center;padding:24px;z-index:2;color:#fff;font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000;text-align:center}
    .ready #loading{display:none}
    #googleLayer{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;width:min(92vw,360px);padding:12px;background:#fffffff2;border:1px solid #d5e4dc;border-radius:15px;box-shadow:0 10px 30px #0007;text-align:center}
    #googleLayer[hidden]{display:none}
    #googleButton{min-height:44px;display:flex;justify-content:center}
    #googleStatus{margin:7px 0 0;color:#51675f;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #bridgeDiagnostics{display:none!important;position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:20;max-width:94vw;background:#fff;color:#174b35;padding:6px 10px;border:1px solid #b9cabe;border-radius:8px;font:12px system-ui}
    #bridgeDiagnostics pre{white-space:pre-wrap;max-height:45vh;overflow:auto}
    #retry{padding:12px 22px;border-radius:10px;font:inherit}
  </style>
</head>
<body>
  <main id="shell">
    <div id="loading"><div><p id="loadingText">Abriendo Mis Gastos…</p><button id="retry" hidden>Reintentar</button></div></div>
    <iframe id="app" data-app="gastos" title="Mis Gastos"
      data-src="https://mis-gastos-ecru.vercel.app/?build=20261017-layout2"
      allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </main>
  <details id="bridgeDiagnostics"><summary id="bridgeSummary">Diagnóstico</summary><pre id="bridgeTrace"></pre></details>
  <section id="googleLayer" hidden>
    <div id="googleButton"></div>
    <p id="googleStatus">Acceso seguro con Google</p>
  </section>
  <noscript>Activa JavaScript para abrir Mis Gastos.</noscript>
  <script src="../install-guide.js?v=20261006-install3" defer></script>
  <script src="../access-bridge.js?v=20261017-gastos2" defer></script>
</body>
</html>
