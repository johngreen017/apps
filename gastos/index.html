<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-title" content="Mis Gastos">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=2">
  <link rel="manifest" href="./site.webmanifest?v=2">
  <title>Mis Gastos</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    .loading{position:fixed;inset:0;display:grid;place-items:center;font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;z-index:2;background:#fff}
    .ready .loading{display:none}
  </style>
</head>
<body>
  <main id="shell">
    <div class="loading">Abriendo Mis Gastos…</div>
    <iframe
      title="Mis Gastos"
      src="https://script.google.com/macros/s/AKfycbx1FyxYYdoiC43fOPc1zBuuM0YYHU-bJx4_XmnWDZKi9aRMa0xK0RAkqb7o8ckAHb2L7g/exec?view=app"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
      onload="document.getElementById('shell').classList.add('ready')"></iframe>
  </main>
</body>
</html>
