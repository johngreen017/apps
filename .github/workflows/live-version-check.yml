name: Verificar versión pública real

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-version-check.yml'
      - 'access-bridge.js'
      - 'install-guide.js'
      - 'tests/access-bridge.test.cjs'
      - 'escalafon-online/index.html'
      - 'escalafon-online/windows.html'
      - 'escalafon-online/manifest.webmanifest'
      - 'revisor-cargo-fiscal/index.html'
      - 'revisor-cargo-fiscal/windows.html'
      - 'revisor-cargo-fiscal/manifest.webmanifest'
      - 'simulador-remuneraciones/index.html'
      - 'simulador-remuneraciones/windows.html'
      - 'simulador-remuneraciones/manifest.webmanifest'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar puente interno de Apps Script
        shell: bash
        run: |
          set -euo pipefail
          files=(
            escalafon-online/index.html escalafon-online/windows.html
            revisor-cargo-fiscal/index.html revisor-cargo-fiscal/windows.html
            simulador-remuneraciones/index.html simulador-remuneraciones/windows.html
          )
          grep -F "data-src=" "${files[@]}" >/dev/null
          node --test tests/access-bridge.test.cjs
          node --check install-guide.js
          grep -F 'install-guide.js?v=20261006-install3' escalafon-online/index.html revisor-cargo-fiscal/index.html simulador-remuneraciones/index.html >/dev/null
          if grep -F "if(event.source!==app.contentWindow)return false;" "${files[@]}"; then
            echo "Persistió la validación incompatible con el iframe interno de Apps Script."
            exit 1
          fi

      - name: Comparar contenido público con y sin cache busting
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1" url="$2" marker="$3"
            for suffix in "" "&audit=$(date +%s)"; do
              echo "===== $name $suffix ====="
              body="$(mktemp)"
              headers="$(mktemp)"
              curl -sS -L --connect-timeout 10 --max-time 30 -D "$headers" -o "$body"                 -H 'Cache-Control: no-cache, no-store, max-age=0'                 -H 'Pragma: no-cache'                 -A 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1'                 "$url$suffix"
              grep -Ei '^(HTTP/|cache-control:|age:|etag:|last-modified:|content-type:|location:)' "$headers" | tail -30 || true
              if grep -Fq "$marker" "$body"; then
                echo "MARKER=SI"
              else
                echo "MARKER=NO"
                echo "--- fragmento ---"
                head -c 800 "$body" | tr '\n' ' '
                echo
                exit 1
              fi
            done
          }

          check "Escalafon launcher" "https://johngreen017.github.io/apps/escalafon-online/?build=20261006-win4" "access-bridge.js?v=20261006-win4"
          check "Revisor launcher" "https://johngreen017.github.io/apps/revisor-cargo-fiscal/?build=20261006-win4" "access-bridge.js?v=20261006-win4"
          check "Simulador launcher" "https://johngreen017.github.io/apps/simulador-remuneraciones/?build=20261006-win4" "access-bridge.js?v=20261006-win4"

          check "Escalafon GAS" "https://script.google.com/macros/s/AKfycbw1JKkWVX7qFp0_HkzuiUa508NpguohvRTwUYnuVl0iMMKzt1u4bHl0CtxDZmq3G4g/exec?build=20261006-push4" "apps-bridge-ready"
          check "Revisor GAS" "https://script.google.com/macros/s/AKfycbzZDRqPGO5638ZfEfuZVSOjfohLeyTlbpd9eE6CkqJppjp8T2-Nrp2Xilf-5LfRu0iR/exec?build=20261006-push3" "apps-bridge-ready"
          check "Simulador GAS" "https://script.google.com/macros/s/AKfycbzq5NkAorgviuYAGVPBOjHgN9vMh7tgAXaCi7jcDo729NHOMDCz4FCiXvvO4vxakGQu/exec?build=20261006-push3" "apps-bridge-ready"

