name: Sync Mis Gastos to Apps Script

on:
  push:
    branches:
      - main
    paths:
      - "gastos/apps-script/**"
      - ".github/workflows/gastos-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gastos/apps-script

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Configure Google authentication
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "Falta el secreto CLASPRC_JSON en GitHub."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push source to Apps Script
        run: clasp push --force

      - name: Update web app deployment
        run: |
          clasp deploy \
            --deploymentId "AKfycbwTGvQmKBtUoBAv8BI3TjybUEJVmoWuc_l7Vlwy5NXPUZuUv6_4MaOANbCpxwrcZeOU" \
            --description "Auto deploy from GitHub ${GITHUB_SHA}"
